pipeline_name: Saureus_Phylogenomics_Outbreak
scripts_dir: ../pipeline_phylogenomics
steps:
  - {id: 1, script: 1_Fetch_And_Verify_Raw_Reads.sh, mode: sbatch}
  - {id: 2, script: 2_Interpret_FastQC_Diagnostics.sh, mode: sbatch}
  - {id: 3, script: 3_Fetch_All_Isolates.sh, mode: sbatch}
  - {id: 4, script: 4_Map_With_BWA.sh, mode: sbatch}
  - {id: 5, script: 5_Call_Variants_Bcftools.sh, mode: sbatch}
  - {id: 6, script: 6_Build_Core_SNP_Alignment.sh, mode: sbatch}
  - {id: 7, script: 7_Infer_Tree_IQTREE.sh, mode: sbatch}
  - {id: 8, script: 8_Interpret_Tree_And_Outbreak_Context.sh, mode: sbatch}
  - {id: 9, script: 9_QC_Report_Generator.sh, mode: sbatch_wrap, wrap_cpus: 1, wrap_mem: 2G, wrap_time: 00:10:00, wrap_partition: batch}
